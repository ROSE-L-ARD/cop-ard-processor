general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      reference_id: EOSAO1A_2024-03-08T17:09:18.480305
      input_slcs_files:
        [
          "s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/UNZIP/EOL1ASARSAO1A9076892/S1A_OPER_SAR_EOSSP__CORE_L1A_OLF_20240310T213417.xemt",
        ]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      initialize_current_reference: true
    outputs:
      cslcs: cslcs
  - name: reference_update
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceUpdate
    inputs:
      slcs: coregistration.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
io:
  adfs:
    - id: REFDB
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/2024-03-08-SRTM/REF_DB
    - id: DEM
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/dem_srtm
  output_products:
    - id: cslcs
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/2024-03-08-SRTM/OUTPUT/CSLC/cslcs_2024-03-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: current_reference
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/2024-03-08-SRTM/OUTPUT/CURRENT_REFERENCE/current_reference_2024-03-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: stable_references
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S3/2024-03-08-SRTM/OUTPUT/STABLE_REFERENCES/stable_reference_2024-03-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 8
    threads_per_worker: 1
    memory_limit: 0
