general_configuration:
  logging:
    level: DEBUG
  triggering__use_basic_logging: true
  triggering__wait_before_exit: 0
  triggering__validate_run: false
  dask_utils__timeout: 3000
  breakpoints:
    activate_all: true
  inspections:
    activate_all: true
    persist_all: true
workflow:
- name: ImportSLC
  module: cop_ard_processor.processing_units
  processing_unit: ImportSLC
  mode: secondary
  parameters:
    input_safe_files:
      - a
      - b
      - c
- name: ImportOrbits
  module: cop_ard_processor.processing_units
  processing_unit: ImportOrbits
  mode: secondary
  inputs:
    slcs: ImportSLC.slcs
  parameters:
    orbit_files:
      - a
      - b
      - c
- name: ImportETAD
  module: cop_ard_processor.processing_units
  processing_unit: ImportETAD
  mode: secondary
  inputs:
    slcs: ImportOrbits.slcs
- name: FinalizeImport
  module: cop_ard_processor.processing_units
  processing_unit: FinalizeImport
  mode: secondary
  inputs:
    slcs: ImportETAD.slcs
- name: ImportDEM
  module: cop_ard_processor.processing_units
  processing_unit: ImportDEM
  mode: secondary
  inputs:
    slcs: FinalizeImport.slcs
  adfs:
    dem: dem
- name: Simulation
  module: cop_ard_processor.processing_units
  processing_unit: Simulation
  mode: secondary
  inputs:
    slcs: FinalizeImport.slcs
    dem: ImportDEM.dem
- name: Coregistration
  module: cop_ard_processor.processing_units
  processing_unit: Coregistration
  mode: secondary
  inputs:
    slcs: FinalizeImport.slcs
    simulation: Simulation.simulation
    simulation_ml: Simulation.simulation_ml
- name: ImageMatching
  module: cop_ard_processor.processing_units
  processing_unit: ImageMatching
  mode: secondary
  inputs:
    slcs: Coregistration.slcs
- name: CMLP
  module: cop_ard_processor.processing_units
  processing_unit: CMLP
  mode: secondary
  inputs:
    slcs: ImageMatching.slcs
- name: GMLP
  module: cop_ard_processor.processing_units
  processing_unit: GMLP
  mode: secondary
  inputs:
    cmlp: CMLP.cmlp
    simulation: Simulation.simulation
    simulation_ml: Simulation.simulation_ml
io:
  adfs:
  - id: dem
    path: /path/to/dem
dask_context:
  cluster_type: local # Optional but if not available "address" is mandatory
  cluster_config:
    n_workers : 1
    threads_per_worker : 8
  client_config: {}

