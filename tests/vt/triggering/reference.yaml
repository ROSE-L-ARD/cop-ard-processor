general_configuration:
  logging:
    level: DEBUG
  triggering__use_basic_logging: true
  triggering__wait_before_exit: 0
  triggering__validate_run: false
  dask_utils__timeout: 3000
  breakpoints:
    activate_all: true
  inspections:
    activate_all: true
    persist_all: true
workflow:
- name: ImportSLC
  module: cop_ard_processor.processing_units
  processing_unit: ImportSLC
  mode: reference
  parameters:
    input_safe_files:
      - a
      - b
      - c
- name: FinalizeImport
  module: cop_ard_processor.processing_units
  processing_unit: FinalizeImport
  mode: reference
  inputs:
    slcs: ImportSLC.slcs
- name: ImportDEM
  module: cop_ard_processor.processing_units
  processing_unit: ImportDEM
  mode: reference
  inputs:
    slcs: FinalizeImport.slcs
  adfs:
    dem: dem
- name: Simulation
  module: cop_ard_processor.processing_units
  processing_unit: Simulation
  mode: reference
  inputs:
    slcs: FinalizeImport.slcs
    dem: ImportDEM.dem
- name: Geometry
  module: cop_ard_processor.processing_units
  processing_unit: Geometry
  mode: reference
  inputs:
    slcs: FinalizeImport.slcs
    simulation: Simulation.simulation
    simulation_ml: Simulation.simulation_ml
- name: Mask
  module: cop_ard_processor.processing_units
  processing_unit: Mask
  mode: reference
  inputs:
    slcs: FinalizeImport.slcs
    simulation: Simulation.simulation
    simulation_ml: Simulation.simulation_ml
io:
  adfs:
  - id: dem
    path: /path/to/dem
  output_products:
  - id: output
    path: output.zarr
    engine: cpm_zarr
dask_context:
  cluster_type: local # Optional but if not available "address" is mandatory
  cluster_config:
    n_workers : 1
    threads_per_worker : 8
  client_config: {}

