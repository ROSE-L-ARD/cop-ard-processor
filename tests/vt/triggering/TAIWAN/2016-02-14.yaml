general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
      ORBIT: ORBIT
    parameters:
      input_slcs_files: ['s3://your-bucket/Inputs/TRACK_069/TAIWAN/SAFE/S1A_IW_SLC__1SDV_20160214T100019_20160214T100049_009941_00E981_ABD9.SAFE',
        's3://your-bucket/Inputs/TRACK_069/TAIWAN/SAFE/S1A_IW_SLC__1SDV_20160214T100047_20160214T100105_009941_00E981_0CA6.SAFE']
      indices: null
      polarization: [VV]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      enable_image_matching: true
      enable_split_spectrum: true
      enable_esd: false
    outputs:
      cslcs: cslcs
io:
  adfs:
    - id: REFDB
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/REF_DB
    - id: DEM
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/dem
    - id: ORBIT
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/ORBIT/S1A_OPER_AUX_POEORB_OPOD_20210310T181217_V20160213T225943_20160215T005943.EOF
  output_products:
    - id: cslcs
      path: s3://your-bucket/Outputs/TRACK_069/TAIWAN/OUTPUT/CSLC/cslcs_2016-02-14.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
