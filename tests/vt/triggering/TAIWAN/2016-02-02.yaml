general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
      ORBIT: ORBIT
    parameters:
      input_slcs_files: ['s3://your-bucket/Inputs/TRACK_069/TAIWAN/SAFE/S1A_IW_SLC__1SDV_20160202T100019_20160202T100049_009766_00E469_C190.SAFE',
        's3://your-bucket/Inputs/TRACK_069/TAIWAN/SAFE/S1A_IW_SLC__1SDV_20160202T100047_20160202T100115_009766_00E469_5727.SAFE']
      indices: null
      polarization: [VV]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      initialize_current_reference: true
    outputs:
      cslcs: cslcs
io:
  adfs:
    - id: REFDB
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/REF_DB
    - id: DEM
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/dem
    - id: ORBIT
      path: s3://your-bucket/Inputs/TRACK_069/TAIWAN/ORBIT/S1A_OPER_AUX_POEORB_OPOD_20210310T142027_V20160201T225943_20160203T005943.EOF
  output_products:
    - id: cslcs
      path: s3://your-bucket/Outputs/TRACK_069/TAIWAN/OUTPUT/CSLC/cslcs_2016-02-02.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: current_reference
      path: s3://your-bucket/Outputs/TRACK_069/TAIWAN/OUTPUT/CURRENT_REFERENCE/current_reference_2016-02-02.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: stable_references
      path: s3://your-bucket/Outputs/TRACK_069/TAIWAN/OUTPUT/STABLE_REFERENCES/stable_reference_2016-02-02.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
