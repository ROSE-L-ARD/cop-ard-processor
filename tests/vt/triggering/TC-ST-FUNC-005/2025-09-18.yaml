general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/SENTINEL1/QUEBEC/TMP/TC-ST-FUNC-005
  triggering__temporary_shared: true
  breakpoints__activate_all: false
  logging__custom_config: ./logger.yaml
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      input_slcs_files: [/data/SENTINEL1/QUEBEC/SAFE/S1C_EW_SLC__1SDH_20250918T111737_20250918T111840_004178_0084C0_AB35.SAFE]
      indices: [0, 1, 99, 100]
      polarization: ["HH"]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      initialize_current_reference: true
    outputs:
      cslcs: cslcs
  - name: reference_update
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceUpdate
    inputs:
      slcs: coregistration.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
io:
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/QUEBEC/WDIR/TC-ST-FUNC-005/REFDB
    - id: DEM
      path: /data/SENTINEL1/QUEBEC/dem
  output_products:
    - id: cslcs
      path: /data/SENTINEL1/QUEBEC/EOPF/OUTPUT/TC-ST-FUNC-005/CSLC/cslcs_2025-09-18.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: current_reference
      path: /data/SENTINEL1/QUEBEC/EOPF/OUTPUT/TC-ST-FUNC-005/CURRENT_REFERENCE/current_reference_2025-09-18.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: stable_references
      path: /data/SENTINEL1/QUEBEC/EOPF/OUTPUT/TC-ST-FUNC-005/STABLE_REFERENCES/stable_reference_2025-09-18.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
