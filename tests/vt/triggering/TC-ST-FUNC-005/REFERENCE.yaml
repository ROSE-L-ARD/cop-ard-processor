general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/SENTINEL1/QUEBEC/TMP/TC-ST-FUNC-005
  triggering__temporary_shared: true
  breakpoints__activate_all: false
  logging__custom_config: ./logger.yaml
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      input_slcs_files: [/data/SENTINEL1/QUEBEC/SAFE/S1C_EW_SLC__1SDH_20250906T111736_20250906T111839_004003_007F66_0CAB.SAFE]
      recompute: true
      indices: [0, 1, 99, 100]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
    parameters:
      recompute: true
      interpolation: linear
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
    parameters:
      recompute: true
io:
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/QUEBEC/WDIR/TC-ST-FUNC-005/REFDB
    - id: DEM
      path: /data/SENTINEL1/QUEBEC/dem
  output_products:
    - id: /not_used
      path: /not_used.zarr
      store_type: zarr
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
