# TC-ST-DSGN-001 / ReferenceGeometry preflight scenario: resolved-parameter sanity (Layer 1).
#
# The upstream Ingestion/ReferenceDEM steps run nominally; the target
# ReferenceGeometry step carries one deliberately broken parameter so the
# Layer-1 preflight engine raises a single PreflightError with exactly one
# violation:
#   - enable_dask: "no"  (a string where a bool is expected)
#
# `triggering__validate_run` is intentionally `false`: downstream units have
# no EOPF contract (Layer 2), and `false` proves the always-on Layer-1
# preflight fires independently of any EOPF validation.
general_configuration:
  triggering__load_default_logging: false
  triggering__use_basic_logging: true
  triggering__validate_run: false
  temporary__folder: /data/SENTINEL1/SURAT/TMP/TC-ST-DSGN-001/reference_geometry
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      input_slcs_files:
        [
          /data/SENTINEL1/SURAT/SAFE/S1A_IW_SLC__1SDV_20230727T084125_20230727T084152_049606_05F712_E111.SAFE,
        ]
      indices: [0, 1, 27, 28]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
    parameters:
      # MOD value: a string where a bool is expected.
      enable_dask: "no"
io:
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/SURAT/WDIR/TC-ST-DSGN-001/REFDB
    - id: DEM
      path: /data/SENTINEL1/SURAT/dem
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
