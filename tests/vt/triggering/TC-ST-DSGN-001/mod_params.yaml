# TC-ST-DSGN-001 — Ingestion preflight: resolved-parameter sanity (Layer 1).
#
# This payload drives the Ingestion unit with three deliberately broken
# parameters so the Layer-1 preflight engine raises a single PreflightError
# carrying exactly three violations:
#   - indices:           [-1]  (a negative sub-swath index)
#   - calibration_type:  WrongCalibration  (not one of BetaZero/GammaZero/SigmaZero)
#   - polarization:      XX    (not one of VV/VH/HH/HV)
#
# `triggering__validate_run` is intentionally `false`: with it `true` the EOPF
# contract (Layer 2) would reject `calibration_type` first. Keeping it `false`
# proves the Layer-1 preflight check fires independently of the EOPF contract.
general_configuration:
  triggering__load_default_logging: false
  triggering__use_basic_logging: true
  triggering__validate_run: false
  temporary__folder: /data/SENTINEL1/SURAT/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      # Nominal (real) Sentinel-1 IW SAFE; only its filename is inspected, so
      # the archive itself need not exist for the parameter checks to run.
      input_slcs_files:
        [
          /data/SENTINEL1/SURAT/SAFE/S1A_IW_SLC__1SDV_20230727T084125_20230727T084152_049606_05F712_E111.SAFE,
        ]
      # MOD value 1: a negative index is not a valid sub-swath/burst selector.
      indices: [-1]
      # MOD value 2: a calibration target outside the allowed set.
      calibration_type: WrongCalibration
      # MOD value 3: a polarization outside the allowed set.
      polarization: XX
io:
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/SURAT/WDIR/TC-ST-DSGN-001/REFDB
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
