general_configuration:
  triggering__load_default_logging: false
  triggering__use_basic_logging: true
  temporary__folder: /data/ROSEL/GPP_007/TMP/TC-ST-FUNC-011
  triggering__temporary_shared: true
  logging__custom_config: ./logger.yaml
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
      ETAD: ETAD
    parameters:
      input_slcs_files: [/data/ROSEL/GPP_007/iSLC/secondary/iSLC]
      indices: [0,1,12,13]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      enable_image_matching: true
      enable_split_spectrum: true
      enable_esd: true
    outputs:
      cslcs: cslcs
  - name: cmlp
    module: cop_ard_processor.processing_units
    processing_unit: CMLP
    inputs:
      slcs: coregistration.slcs
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
  - name: geocoding
    module: cop_ard_processor.processing_units
    processing_unit: Geocoding
    inputs:
      cmlp: cmlp.cmlp
      slcs: coregistration.slcs
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      gmlp: gmlp
io:
  adfs:
    - id: REFDB
      path: /data/ROSEL/GPP_007/WDIR/TC-ST-FUNC-011/REFDB
    - id: DEM
      path: /data/ROSEL/GPP_007/dem
  output_products:
    - id: cslcs
      path: /data/ROSEL/GPP_007/EOPF/OUTPUT/TC-ST-FUNC-011/CSLC/cslcs_1999-12-31.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: gmlp
      path: /data/ROSEL/GPP_007/EOPF/OUTPUT/TC-ST-FUNC-011/GMLP/gmlp_1999-12-31.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: current_reference
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-011/CURRENT_REFERENCE/current_reference_1999-12-31.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: stable_references
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-011/STABLE_REFERENCES/stable_reference_1999-12-31.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
