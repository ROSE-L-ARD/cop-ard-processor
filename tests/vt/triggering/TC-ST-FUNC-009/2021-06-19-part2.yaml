general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/SENTINEL1/MOROCCO/TMP/TC-ST-FUNC-009
  triggering__temporary_shared: true
  breakpoints__activate_all: false
  logging__custom_config: ./logger.yaml
workflow:
  - name: cmlp
    module: cop_ard_processor.processing_units
    processing_unit: CMLP
    inputs:
      slcs: cslcs
    parameters:
      posting: { "azimuth_time": 10, "slant_range_time": 10 }
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
  - name: geocoding
    module: cop_ard_processor.processing_units
    processing_unit: Geocoding
    inputs:
      cmlp: cmlp.cmlp
      slcs: cslcs
    parameters:
      spacing: {x: 50, y: 50}
    adfs:
      REFDB: REFDB
    outputs:
      gmlp: gmlp
io:
  input_products:
    - id: cslcs
      path: /data/SENTINEL1/MOROCCO/EOPF/OUTPUT/TC-ST-FUNC-009/CSLC/cslcs_2021-06-19.zarr
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/MOROCCO/WDIR/TC-ST-FUNC-009/REFDB
    - id: DEM
      path: /data/SENTINEL1/MOROCCO/dem
  output_products:
    - id: gmlp
      path: /data/SENTINEL1/MOROCCO/EOPF/OUTPUT/TC-ST-FUNC-009/GMLP/gmlp_2021-06-19.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: current_reference
      path: /data/SENTINEL1/MOROCCO/EOPF/OUTPUT/TC-ST-FUNC-009/CURRENT_REFERENCE/current_reference_2021-06-19.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: stable_references
      path: /data/SENTINEL1/MOROCCO/EOPF/OUTPUT/TC-ST-FUNC-009/STABLE_REFERENCES/stable_reference_2021-06-19.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
