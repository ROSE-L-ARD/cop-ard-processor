general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      input_slcs_files:
        [
          "s3://bopen-sar/ARD-ROSE-L/SENTINEL/Surat/009/SAFE/S1A_IW_SLC__1SDV_20230727T084125_20230727T084152_049606_05F712_E111.SAFE",
        ]
      recompute: true
      indices: null
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
    parameters:
      recompute: true
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
    parameters:
      recompute: true
io:
  adfs:
    - id: REFDB
      path: s3://bopen-sar/ARD-ROSE-L/SENTINEL/Surat/009/REF_DB
    - id: DEM
      path: s3://bopen-sar/ARD-ROSE-L/SENTINEL/Surat/009/dem
  output_products:
    - id: /not_used
      path: /not_used.zarr
      store_type: zarr
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 6
    threads_per_worker: 1
    memory_limit: 0
