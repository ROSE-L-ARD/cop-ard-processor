general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      input_slcs_files: ['s3://bopen-sar/ARD-ROSE-L/SAOCOM/Murcia/ASC/S4/UNZIP/EOL1ASARSAO1B13935213/S1B_OPER_SAR_EOSSP__CORE_L1A_OLF_20251203T203834.xemt']
      recompute: true
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
    parameters:
      recompute: true
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
    parameters:
      recompute: true
io:
  adfs:
    - id: REFDB
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Murcia/ASC/S4/REF_DB
    - id: DEM
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Murcia/ASC/S4/dem
  output_products:
    - id: /not_used
      path: /not_used.zarr
      store_type: zarr
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 12
    threads_per_worker: 1
    memory_limit: 0
