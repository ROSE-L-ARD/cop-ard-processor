general_configuration:
  triggering__load_default_logging: false
  triggering__use_basic_logging: true
  temporary__folder: /data/SENTINEL1/SURAT/TMP/TC-ST-FUNC-003
  triggering__temporary_shared: true
  breakpoints__activate_all: true
  breakpoints__folder: /data/SENTINEL1/SURAT/TMP/breakpoints/TC-ST-FUNC-003
  logging__custom_config: ./logger.yaml
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
      ETAD: ETAD
    parameters:
      input_slcs_files:
        [
          /data/SENTINEL1/SURAT/SAFE/S1A_IW_SLC__1SDV_20230808T084125_20230808T084152_049781_05FC83_76A9.SAFE,
        ]
      indices: [0, 1, 27, 28]
      polarization: ["VV"]
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    parameters:
      enable_image_matching: false
      enable_split_spectrum: false
      enable_esd: true
    outputs:
      cslcs: cslcs
  - name: reference_update
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceUpdate
    inputs:
      slcs: coregistration.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
io:
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/SURAT/WDIR/TC-ST-FUNC-003/REFDB
    - id: DEM
      path: /data/SENTINEL1/SURAT/dem
    - id: ETAD
      path: /data/SENTINEL1/SURAT/ETAD/S1A_IW_ETA__AXDV_20230808T084125_20230808T084152_049781_05FC83_2F44.SAFE
  output_products:
    - id: cslcs
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-003/CSLC/cslcs_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: current_reference
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-003/CURRENT_REFERENCE/current_reference_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: stable_references
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-003/STABLE_REFERENCES/stable_reference_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
dask_context:
  cluster_type: address
  client_config:
    address: "tcp://127.0.0.1:8786"
