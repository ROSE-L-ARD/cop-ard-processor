general_configuration:
  triggering__load_default_logging: false
  triggering__use_basic_logging: true
  temporary__folder: /data/SENTINEL1/SURAT/TMP/TC-ST-FUNC-007
  triggering__temporary_shared: true
  logging__custom_config: ./logger.yaml
workflow:
  - name: cmlp
    module: cop_ard_processor.processing_units
    processing_unit: CMLP
    inputs:
      slcs: cslcs
    adfs:
      REFDB: REFDB
    outputs:
      current_reference: current_reference
      stable_references: stable_references
  - name: geocoding
    module: cop_ard_processor.processing_units
    processing_unit: Geocoding
    inputs:
      cmlp: cmlp.cmlp
      slcs: cslcs
    adfs:
      REFDB: REFDB
    outputs:
      gmlp: gmlp
io:
  input_products:
    - id: cslcs
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-007/CSLC/cslcs_2023-08-08.zarr
  adfs:
    - id: REFDB
      path: /data/SENTINEL1/SURAT/WDIR/TC-ST-FUNC-007/REFDB
    - id: DEM
      path: /data/SENTINEL1/SURAT/dem
    - id: ETAD
      path: /data/SENTINEL1/SURAT/ETAD/S1A_IW_ETA__AXDV_20230808T084125_20230808T084152_049781_05FC83_2F44.SAFE
  output_products:
    - id: gmlp
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-007/GMLP/gmlp_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: current_reference
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-007/CURRENT_REFERENCE/current_reference_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
    - id: stable_references
      path: /data/SENTINEL1/SURAT/EOPF/OUTPUT/TC-ST-FUNC-007/STABLE_REFERENCES/stable_reference_2023-08-08.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: "w"
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 16
    threads_per_worker: 1
    memory_limit: 0
