general_configuration:
  triggering__load_default_logging: false
  triggering__validate_run: false
  temporary__folder: /data/scratch/external/TMP
  triggering__temporary_shared: true
  breakpoints__activate_all: false
workflow:
  - name: ingestion
    module: cop_ard_processor.processing_units
    processing_unit: Ingestion
    adfs:
      REFDB: REFDB
    parameters:
      reference_id: EOSAO1A_2020-03-13T17:08:56.458049
      input_slcs_files: ['s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/UNZIP/EOL1ASARSAO1A5910170/S1A_OPER_SAR_EOSSP__CORE_L1A_OLF_20221128T123043.xemt']
  - name: reference_dem
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: ingestion.slcs
    adfs:
      DEM: DEM
      REFDB: REFDB
  - name: reference_geometry
    module: cop_ard_processor.processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
    adfs:
      REFDB: REFDB
  - name: coregistration
    module: cop_ard_processor.processing_units
    processing_unit: Coregistration
    inputs:
      slcs: ingestion.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
      IONO: IONO
    parameters:
      initialize_current_reference: true
    outputs:
      cslcs: cslcs
  - name: cmlp
    module: cop_ard_processor.processing_units
    processing_unit: CMLP
    inputs:
      slcs: coregistration.slcs
      dem: reference_dem.dem
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      cmlp: cmlp
      current_reference: current_reference
      stable_references: stable_references
  - name: geocoding
    module: cop_ard_processor.processing_units
    processing_unit: Geocoding
    inputs:
      cmlp: cmlp.cmlp
      slcs: coregistration.slcs
      simulation_ref: reference_geometry.simulation_ref
      simulation_ml: reference_geometry.simulation_ml
    adfs:
      REFDB: REFDB
    outputs:
      gmlp: gmlp
io:
  adfs:
    - id: REFDB
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/REF_DB
    - id: DEM
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/dem
    - id: IONO
      path: s3://bopen-sar/ARD-ROSE-L/SW-All.csv
  output_products:
    - id: cslcs
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/OUTPUT/CSLC/cslcs_2020-03-13.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: cmlp
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/OUTPUT/CMLP/cmlp_2020-03-13.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: current_reference
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/OUTPUT/CURRENT_REFERENCE/current_reference_2020-03-13.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: stable_references
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/OUTPUT/STABLE_REFERENCES/stable_reference_2020-03-13.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
    - id: gmlp
      path: s3://bopen-sar/ARD-ROSE-L/SAOCOM/Naples/DSC/S4/OUTPUT/GMLP/gmlp_2020-03-13.zarr
      engine: cpm_zarr
      type: file
      writer_params:
        mode: 'w'
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 12
    threads_per_worker: 1
    memory_limit: 0
