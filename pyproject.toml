[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cop_ard_processor"
authors = [{ name = "B-Open" }]
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
requires-python = ">=3.13, <3.14"

# By default, the project template does not rely on any specific
# version of the EOPF CPM. The source code examples are validated
# against the latest release.
# Users are encouraged to fix the EOPF CPM version to make sure to
# have a stable build environment.
dependencies = [
    "cop-ard-app @ git+ssh://git@github.com/bopen/cop-ard-app.git",  # TODO pin
    "eopf==3.0.0",
]

[project.optional-dependencies]
cluster-plugin = ["eopf[cluster-plugin] >= 3.0.0rc4"]
tests = ["eopf[tests] >= 3.0.0rc4"]
linter = ["eopf[linter] >= 3.0.0rc4"]
typing = ["eopf[typing] >= 3.0.0rc4"]
formatter = ["eopf[formatter] >= 3.0.0rc4"]
security = ["eopf[security] >= 3.0.0rc4"]
notebook = ["eopf[notebook] >= 3.0.0rc4"]
doc = [
    "eopf[doc]",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-plantuml",
    "sphinxcontrib-spelling",
    "sphinx-test-reports",
]
complexity = ["eopf[complexity] >= 3.0.0rc4"]
doc-cov = ["eopf[doc-cov] >= 3.0.0rc4"]
dev = ["ipykernel","matplotlib"]

[tool.ruff]
line-length = 120
target-version = "py311"


[tool.pytest.ini_options]
markers = ["integration", "unit", "need_files"]
[[tool.uv.index]]
url = "https://pypi.org/simple"
